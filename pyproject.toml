[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qday-time-machine"
version = "1.0.1"
description = "Quantum-threat scanner and Q-Day forecaster: find RSA/ECC a quantum computer will break, see the year, get the post-quantum fix and a CycloneDX CBOM"
readme = "docs/PYPI.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Raunak Kumar Gupta" },
  { name = "Krish Jain" },
]
keywords = [
  "quantum", "post-quantum", "cryptography", "pqc", "qiskit", "shor", "grover", "cbom", "cyclonedx",
  "ml-kem", "ml-dsa", "security", "quantum-safe",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qiskit>=2.1",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.41",
  "cryptography>=44",
  "kyber-py>=1.2",
  "dilithium-py>=1.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "quantum-debugger>=1.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20", "pandas>=2.0", "matplotlib>=3.8", "pylatexenc>=2.10", "aiohttp>=3.9"]
dev = ["pytest>=8.0", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
qday = "qday.cli:main"

[project.urls]
Homepage = "https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-straw-hat-pirates"
Documentation = "https://qday-time-machine.readthedocs.io/"
Source = "https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-straw-hat-pirates"
Demo = "https://youtu.be/nhXP6QLFjoU"
Changelog = "https://qday-time-machine.readthedocs.io/en/latest/changelog/"
Issues = "https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-straw-hat-pirates/issues"

[tool.setuptools.packages.find]
include = ["qday*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore"]
markers = [
  "network: needs internet access",
  "hardware: submits jobs to real IBM Quantum hardware (costs QPU time)",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["E402"]
"samples/*" = ["S"]  # deliberately vulnerable demo code for the scanner

[tool.coverage.run]
source = ["qday"]
omit = ["qday/ui.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

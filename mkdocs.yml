site_name: Q-Day Time Machine
site_description: Find the cryptography a quantum computer will break, see when it breaks, and get the post-quantum fix.
site_author: Raunak Kumar Gupta, Krish Jain
site_url: https://qday-time-machine.readthedocs.io/
repo_url: https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-straw-hat-pirates
repo_name: vtu-hc-straw-hat-pirates
edit_uri: edit/main/docs/
copyright: MIT License · Team Straw Hat Pirates · Qiskit Fall Fest 2026

docs_dir: docs
exclude_docs: |
  PYPI.md
  judge-qa.md
  *.pptx

nav:
  - Home: index.md
  - User guide: USER_GUIDE.md
  - Methods: methods.md
  - Hardware results: RESULTS.md
  - Architecture: ARCHITECTURE.md
  - API reference: api.md
  - Changelog: changelog.md

theme:
  name: material
  language: en
  icon:
    logo: material/clock-time-four-outline
    repo: fontawesome/brands/github
  font:
    text: DM Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vtu-qiskit-fall-fest-2026/vtu-hc-straw-hat-pirates
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/qday-time-machine/
    - icon: fontawesome/brands/youtube
      link: https://youtu.be/nhXP6QLFjoU

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
